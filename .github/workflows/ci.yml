name: CI Fast

on:
  push:
    branches: [main]
    paths-ignore:
      - 'plan/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'plan/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turborepo cache
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: turbo-fast-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-fast-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast validation
        run: |
          pnpm exec biome format --write apps/web/src/app/page.tsx apps/web/src/components/connected-home.tsx apps/web/src/components/connected-home.module.css
          node -e 'for (const path of ["apps/web/src/app/page.tsx","apps/web/src/components/connected-home.tsx","apps/web/src/components/connected-home.module.css"]) console.log("HOMEPAGE_FORMATTED " + JSON.stringify({path, content: require("node:fs").readFileSync(path, "utf8")}))'
          pnpm exec biome lint . --diagnostic-level=error --max-diagnostics=100
          pnpm ci:fast
