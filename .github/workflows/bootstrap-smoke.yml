name: Fresh Clone Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-smoke.yml'

permissions:
  contents: read

concurrency:
  group: fresh-clone-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Clean bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run one-command bootstrap
        run: bash scripts/bootstrap.sh
