name: Format Repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format.yml'

permissions:
  contents: write

concurrency:
  group: format-repository
  cancel-in-progress: true

jobs:
  format:
    name: Apply canonical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Commit formatting when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git commit -m "style: apply canonical formatting [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
